<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ИТП v4.0.1</title>
<style>
:root{--bg:#F5F9F6;--card:#fff;--ink:#1F2A24;--muted:#66756C;--accent:#278A5A;--on:#fff;--line:#DCE8E0;--bad:#D0524F;--ok:#3DBE7A;--soft:#E3F4E9;--code:#EEF5F0;--rab:#D9CBB8;--kw:#0033B3;--st:#067D17;--nm:#1750EB;--cm:#8A9690;--bi:#871094;--fs:#E36209;--ms:#00838F;--ml:#B5472E;--md:#9C6500;--mt:#C2185B;--mf:#607D8B;--c0:#E6EEE9;--c1:#BDE5CC;--c2:#7FCB9F;--c3:#3FAE72;--c4:#1F7A4D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C1C21;--card:#26262D;--ink:#ECEAF5;--muted:#A19EB4;--accent:#9B7BF7;--on:#17131F;--line:#37373F;--bad:#F58A90;--soft:#33294F;--code:#1F1F25;--rab:#E6E1F2;--kw:#CC7832;--st:#8FB573;--nm:#6897BB;--cm:#7D7A8C;--bi:#9FA0E0;--fs:#FF9E3D;--ms:#4EC9B0;--ml:#E08A6D;--md:#D7BA7D;--mt:#E57CA8;--mf:#8FA1B3;--c0:#2E2E36;--c1:#27493B;--c2:#2F7A58;--c3:#3FA777;--c4:#74E0A8}}
:root[data-theme="dark"]{--bg:#1C1C21;--card:#26262D;--ink:#ECEAF5;--muted:#A19EB4;--accent:#9B7BF7;--on:#17131F;--line:#37373F;--bad:#F58A90;--soft:#33294F;--code:#1F1F25;--rab:#E6E1F2;--kw:#CC7832;--st:#8FB573;--nm:#6897BB;--cm:#7D7A8C;--bi:#9FA0E0;--fs:#FF9E3D;--ms:#4EC9B0;--ml:#E08A6D;--md:#D7BA7D;--mt:#E57CA8;--mf:#8FA1B3;--c0:#2E2E36;--c1:#27493B;--c2:#2F7A58;--c3:#3FA777;--c4:#74E0A8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:500;font-size:17px;line-height:1.5;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#app{max-width:560px;margin:0 auto;padding:20px 18px 40px;min-height:100%}
#app.in{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#app.sh{animation:sh .38s}
@keyframes sh{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
#vg{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:9}
#vg.ok{box-shadow:inset 0 0 100px 30px var(--ok)}
#vg.no{box-shadow:inset 0 0 100px 30px var(--bad)}
@keyframes vg{0%{opacity:0}25%{opacity:.85}100%{opacity:0}}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}
h1{font-size:23px;font-weight:800;margin:0}
h2{font-size:22px;font-weight:800;margin:0 0 10px}
.chips{display:flex;gap:8px;align-items:center}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;display:grid;place-items:center;padding:0;flex:none}
.mu{color:var(--muted);font-size:15px}
.pet{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:12px 18px;margin-bottom:22px}
.lesson{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:10px;cursor:pointer;text-align:left;font-weight:700;transition:transform .15s}
.lesson:active{transform:scale(.98)}
.lesson small{display:block;color:var(--muted);font-weight:500;font-size:14px}
.badge{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.badge.done{background:var(--accent);color:var(--on)}
pre,.out{background:var(--code);border:1px solid var(--line);border-radius:18px;padding:14px 18px;margin:0 0 14px;overflow-x:auto;font:600 15px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap}
code{background:var(--code);border-radius:8px;padding:1px 6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
textarea,input.f{width:100%;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px 18px;font:600 16px/1.5 ui-monospace,Menlo,Consolas,monospace}
textarea{min-height:170px;resize:vertical;margin-bottom:10px;tab-size:4}
textarea:focus,input.f:focus{border-color:var(--accent);outline:none}
input.f.n{font-family:inherit;font-weight:700;font-size:19px;text-align:center}
.btn{display:block;width:100%;border:0;border-radius:999px;background:var(--accent);color:var(--on);padding:15px;font-weight:800;font-size:17px;cursor:pointer;margin-top:12px}
.btn.g{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:10px}
.fb{margin-top:14px;border-radius:22px;padding:14px 18px;background:var(--soft)}
.fb.bad{background:transparent;border:2px solid var(--bad)}
.fb b{display:block;font-size:18px}
.fb.bad b{color:var(--bad)}
.center{text-align:center;padding-top:40px}
.center p{color:var(--muted);margin:0 0 6px}
.th p{margin:0 0 12px}
.rw{width:150px;margin:0 auto}
.pet .rw{width:96px;margin:0;flex:none}
.rw svg{width:100%;overflow:visible;display:block}
.rw .hd{transform-box:fill-box;transform-origin:50% 100%}
.rab .sc,.rab .cr,.rab .zz{display:none}
.eat .cr,.happy .sc{display:block}.lie .zz{display:block}
.eat .hd{animation:nod .45s infinite alternate}
@keyframes nod{to{transform:rotate(9deg) translateY(3px)}}
.lie .rb{transform:translateY(12px) scaleY(.78);transform-box:fill-box;transform-origin:bottom}
.run{animation:dash 2.6s infinite alternate ease-in-out}
.run .rb{animation:hop .3s infinite alternate}
@keyframes dash{to{transform:translateX(40px)}}
@keyframes hop{to{transform:translateY(-8px)}}
.happy .rb{animation:hop .6s infinite alternate}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.topic{margin-bottom:38px}
.topic h2{margin:0}
.path{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:16px}
.ilw{text-align:center;transition:transform .2s}
.flag{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:800;margin-bottom:8px;white-space:nowrap}
.ilw .mu{font-size:13px;margin-top:2px}
.bar{flex:1;height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .35s}
.q{margin:24px 0 14px;font-size:21px;font-weight:800;line-height:1.35}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 18px;margin-bottom:10px;cursor:pointer;font-weight:700}
.opt.sel,.opt.ok{border-color:var(--accent);background:var(--soft)}
.opt.no{border-color:var(--bad)}
.opt[disabled]{cursor:default}
.th b{color:var(--accent);background:var(--soft);border-radius:8px;padding:0 6px;font-weight:800}
.kw{color:var(--kw);font-weight:800}.st{color:var(--st)}.nm{color:var(--nm)}.cm{color:var(--cm)}.bi{color:var(--bi)}
.ed{position:relative;margin-bottom:10px;border:2px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden}
.ed:focus-within{border-color:var(--accent)}
.ed pre,.ed textarea{margin:0;padding:14px 18px;border:0;border-radius:0;background:none;font:600 16px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;tab-size:4;width:100%;height:190px;min-height:190px;display:block;overflow:auto}
.ed pre{position:absolute;inset:0;overflow:hidden;pointer-events:none;color:var(--ink)}
.ed textarea{position:relative;color:transparent;caret-color:var(--ink);resize:none;outline:none}
.inrow{display:flex;gap:8px;max-height:0;opacity:0;overflow:hidden;visibility:hidden;transform:translateY(8px);margin:0;transition:max-height .3s,opacity .3s,transform .3s,margin .3s,visibility 0s .3s}
.inrow.on{max-height:80px;opacity:1;visibility:visible;transform:none;margin:10px 0;transition-delay:0s}
.inrow input{flex:1;min-width:0;height:50px;padding:0 16px}
.inrow .btn{height:50px;margin:0;width:auto;padding:0 22px;flex:none}
.isl{position:relative;background:none;border:0;padding:0;cursor:pointer;width:92px;height:80px;transition:transform .15s}
.isl:active{transform:translateY(3px)}
.isl svg{display:block}
.isl .sw{fill:#000;opacity:.16}
.isl path{fill:var(--line);stroke:var(--line);stroke-width:6;stroke-linejoin:round}
.isl.op path{fill:var(--soft);stroke:var(--soft)}
.isl.dn path,.isl.cur path{fill:var(--accent);stroke:var(--accent)}
.isl path.sd{filter:brightness(.72)}
.isl span{position:absolute;left:0;top:8px;width:92px;height:52px;display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--on)}
#app{padding-bottom:120px}
.ed textarea{scrollbar-width:none}.ed textarea::-webkit-scrollbar{display:none}
.isl path.gl{fill:var(--accent);stroke:var(--accent);opacity:0}
.isl.cur path.gl{opacity:.9;animation:glow 1.8s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 2px var(--accent))}to{filter:drop-shadow(0 0 8px var(--accent))}}
.rab .ht{display:none;transform-box:fill-box;transform-origin:center}
.love .ht{display:block;animation:heart 1.2s ease-out both}
@keyframes heart{from{opacity:0;transform:scale(.2)}30%{opacity:1;transform:scale(1.25)}to{opacity:1;transform:scale(1) translateY(-6px)}}
.love .rb{animation:hop .35s 5 alternate}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pop{position:fixed;left:50%;top:36%;z-index:10;pointer-events:none;text-align:center;animation:popup 1.2s ease-out forwards}
.pop span{display:block;font-size:64px;line-height:1.1}
.pop b{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 16px;font-size:20px;font-weight:800}
@keyframes popup{0%{opacity:0;transform:translate(-50%,24px) scale(.4)}25%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-80px) scale(1)}}
.nav{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(94vw,560px);transform:translate(-50%,140%);display:flex;gap:4px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:0 6px 24px rgba(0,0,0,.12);visibility:hidden;z-index:5;transition:transform .3s,visibility 0s .3s}
.nav.on{transform:translate(-50%,0);visibility:visible;transition-delay:0s}
.nav button{flex:1;border:0;background:none;border-radius:22px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
.nav button span{font-size:22px;line-height:1}
.nav button.act{background:var(--soft);color:var(--accent)}
@media (min-width:768px){#app{max-width:680px}.nav{width:min(60vw,560px)}.nav button{font-size:14px}.nav button span{font-size:26px}}
.isl svg{overflow:visible}
.isl{width:118px;height:103px}
.isl span{top:10px;width:118px;height:67px;font-size:30px}
.isl path{transition:fill .5s,stroke .5s}
.isl path.gl{transition:opacity .6s}
.path{position:relative;gap:26px}
.ilw{position:relative;z-index:1}
.ilw .flag{transition:opacity .4s}
.ilw.wait .flag{opacity:0}
.ilw.wait .isl path{fill:var(--line)!important;stroke:var(--line)!important}
.ilw.wait .isl path.gl{opacity:0!important;animation:none}
.ilw.wait .isl span{opacity:.4}
.cn{position:absolute;left:0;top:0;pointer-events:none;z-index:0}
.seg{fill:none;stroke:var(--line);stroke-width:6;stroke-linecap:round;stroke-dasharray:1 14}
.seg.lit{stroke:var(--accent);stroke-dasharray:none}
.fs{color:var(--fs);font-weight:800}.ms{color:var(--ms)}.ml{color:var(--ml)}.md{color:var(--md)}.mt{color:var(--mt)}.mf{color:var(--mf)}
.ed{display:flex}
.ew{position:relative;flex:1;min-width:0}
.gt{padding:14px 10px 14px 12px;text-align:right;color:var(--cm);font:600 16px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;user-select:none;overflow:hidden;white-space:pre;border-right:1px solid var(--line);min-width:2.8em;height:190px}
.stats{justify-content:center}
.isl{display:block;margin:0 auto;width:118px;height:82px}
.isl span{top:3px;width:118px;height:60px;font-size:30px}
.path{gap:34px}
.ilw .flag{position:absolute;left:50%;top:-30px;transform:translateX(-50%);margin:0}
.ilw .mu{margin-top:0}
.sbar{flex:1;display:flex;gap:4px}
.sbar i{flex:1;height:12px;background:var(--line);border-radius:999px;transition:background .3s}
.sbar i.ok{background:var(--accent)}.sbar i.bad{background:var(--bad)}
.term{background:var(--soft);color:var(--accent);border:0;border-radius:8px;padding:0 6px;font:inherit;font-weight:800;cursor:pointer;text-decoration:underline dotted}
.th b{background:none;color:inherit;padding:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:18px;animation:in .2s}
.mc{background:var(--card);border-radius:26px;padding:20px;max-width:460px;width:100%}
.mc p{margin:0 0 10px}
.erow{display:flex;align-items:center;gap:10px;margin:8px 0}
.erow span{flex:0 0 38%;font-size:15px}
.erow b{width:28px;text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 18px;margin-bottom:12px}
.card p{margin:6px 0 10px}
.note{width:100%;min-height:64px;border:2px solid var(--line);border-radius:14px;background:var(--bg);padding:10px 12px;font-family:inherit;font-weight:500;font-size:16px;resize:vertical;margin:0}
.seg2{display:flex;gap:8px;margin:0 0 14px}
.seg2 button{flex:1;padding:10px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:800;cursor:pointer}
.seg2 button.on{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.rw img{display:block;width:100%;height:auto}
.center .rw.im{width:min(280px,72vw)}

/* ===== v4.0.1 ===== */
[hidden]{display:none!important}
.mc{max-height:92vh;overflow:auto}
.seg2.sm{gap:6px;margin:0 0 8px}.seg2.sm button{padding:7px 12px;font-size:14px;border-width:1.5px}.seg2.fl{flex-wrap:wrap}.seg2.fl button{flex:none;padding:6px 12px}
.kb{display:none}
@media (hover:hover) and (pointer:fine){.kb{display:grid}}
kbd{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font:700 13px ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.kt{width:100%;border-collapse:collapse}.kt td{padding:5px 0;font-size:15px;vertical-align:top}.kt td:first-child{white-space:nowrap;padding-right:14px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;z-index:40;max-width:90vw;text-align:center;pointer-events:none;animation:toast 2.2s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.rbn i{display:inline-block;font-style:normal;animation:rbw 1.4s ease-in-out infinite,rbc 5s linear infinite;animation-delay:calc(var(--i)*-.14s),calc(var(--i)*-.5s)}
@keyframes rbw{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-.18em) scale(1.14)}}
@keyframes rbc{0%{color:#ff4d6d}17%{color:#ff9f1c}34%{color:#f5d90a}50%{color:#2ec27e}67%{color:#2e9bff}84%{color:#a35bff}100%{color:#ff4d6d}}
.ver{position:relative;display:inline-block;cursor:help;border-bottom:1px dotted var(--muted)}
.vt{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) translateY(4px);background:var(--ink);color:var(--bg);padding:6px 12px;border-radius:12px;white-space:nowrap;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.ver:hover .vt,.ver:focus-visible .vt,.ver.on .vt{opacity:1;transform:translateX(-50%)}
/* словарь */
.dq{height:40px;padding:0 16px;border-radius:999px;margin-bottom:6px}
input.f.dq{font:500 15px/1 inherit;font-family:inherit}
.dm{font-size:13px;color:var(--muted);margin:2px 4px 6px}
.dt{font-size:13px;font-weight:700;color:var(--muted);margin:14px 4px 6px}
.dl{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0 14px;margin-bottom:8px}
.de+.de{border-top:1px solid var(--line)}
.dh{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;background:none;border:0;padding:8px 0;cursor:pointer;text-align:left}
.dh code{font-weight:800;font-size:16px}
.dn{font-size:13px}
.de:not(.hn) .dn{display:none}
.dc{margin-left:auto;color:var(--muted);font-size:13px;transition:transform .2s}
.de.op .dc{transform:rotate(90deg)}
.dp{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .22s ease,visibility 0s .22s}
.de.op .dp{grid-template-rows:1fr;visibility:visible;transition-delay:0s}
.di{overflow:hidden;min-height:0}
.dx{padding:0 1px 12px}
.dx p{margin:0 0 8px;font-size:15px;line-height:1.45}
.dp .note{display:block;min-height:38px;padding:8px 12px;font-size:15px;border-radius:12px;resize:none;overflow:hidden}
/* календарь */
.l0{background:var(--c0)}.l1{background:var(--c1)}.l2{background:var(--c2)}.l3{background:var(--c3)}.l4{background:var(--c4)}
.cal{display:flex;gap:6px}
.cwd{display:grid;grid-template-rows:repeat(7,12px);gap:3px;margin-top:17px;font-size:10px;line-height:12px;color:var(--muted)}
.csc{flex:1;min-width:0;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.cmo{display:grid;grid-template-columns:repeat(53,12px);gap:3px;height:14px;margin-bottom:3px;font-size:10px;line-height:14px;color:var(--muted);white-space:nowrap;width:max-content}
.cg{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);grid-auto-columns:12px;gap:3px;width:max-content}
.cg i{border-radius:3px}
.cg .fu{visibility:hidden}
.cg .td{outline:2px solid var(--accent);outline-offset:-1px}
.cinfo{font-size:14px;min-height:21px;margin-top:6px}
.cft{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--muted)}
.cleg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin:0 2px;vertical-align:-2px}
/* сохранения в компиляторе */
.fname{display:flex;align-items:center;gap:8px;max-width:100%;background:var(--soft);color:var(--accent);border:0;border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px;cursor:pointer;margin:0 0 8px}
.fname #fnt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--fs);flex:none}
.sr{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 6px 4px 14px;margin-bottom:8px}
.sr .so{flex:1;min-width:0;background:none;border:0;text-align:left;cursor:pointer;padding:8px 0}
.sr .so b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr .so small{color:var(--muted);font-weight:500;font-size:13px}
.sr .sa{width:40px;height:40px;border:0;border-radius:50%;background:none;cursor:pointer;font-size:17px;flex:none}
.sr .sa:hover{background:var(--soft)}
#pr .rw{width:150px;margin:0 auto}
.rw svg{position:relative}
.rw.lie svg,.rw.run svg,.rw.love svg{left:-4%}
.rw.happy svg{left:7%}
</style>
</head>
<body>

  modal('<h2 style="font-size:20px">Поделиться прогрессом</h2><div id="shw" style="min-height:120px"><p class="mu">Рисую картинку…</p></div><p class="mu" style="margin:10px 0 0;font-size:14px">'+esc(tx)+'</p>',btns);
  drawCard(function(cv){
    var h=$('shw');if(!h)return;h.innerHTML='';
    cv.style.cssText='width:100%;max-height:46vh;object-fit:contain;border-radius:16px;display:block';cv.setAttribute('role','img');cv.setAttribute('aria-label','Картинка с твоим прогрессом');
    h.appendChild(cv);cv.toBlob(function(b){BLOB=b},'image/png');
  });
}
var DESK=matchMedia('(hover:hover) and (pointer:fine)').matches;
function toggleTheme(){S.theme=isDark()?'light':'dark';applyTheme();save();if(HRE)HRE()}
function toggleMute(){S.mute=S.mute?0:1;save();if(HRE)HRE();toast(S.mute?'Звук выключен':'Звук включён')}
function keys(){
  modal('<h2 style="font-size:20px">Горячие клавиши</h2><table class="kt">'+[['Ctrl + Enter','Запустить код'],['Ctrl + S','Сохранить код (в компиляторе)'],['Esc','Назад или закрыть окно'],['Ctrl + H','Подсказка в задании'],['Ctrl или Alt + 1…4','Главная, ОГЭ/ЕГЭ, Компилятор, Профиль'],['Ctrl + D','Светлая или тёмная тема'],['Ctrl + M','Звук вкл/выкл'],['F1 или ?','Это окно']].map(function(r){return'<tr><td><kbd>'+r[0]+'</kbd></td><td>'+r[1]+'</td></tr>'}).join('')+'</table><p class="mu" style="margin:10px 0 0;font-size:14px">Некоторые браузеры занимают Ctrl + цифры под переключение вкладок, тогда используй Alt + цифры. Сочетания работают на любой раскладке.</p>',[['Закрыть']]);
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    var m=document.querySelector('.modal');if(m){e.preventDefault();m.remove();return}
    if(!DESK)return;
    var x=$('x');if(x){e.preventDefault();x.click()}else if(CURTAB&&CURTAB!=='home'){e.preventDefault();home()}
    return;
  }
  if(!DESK)return;
  var ctl=e.ctrlKey||e.metaKey,c=e.code,ty=/^(INPUT|TEXTAREA)$/.test((e.target&&e.target.tagName)||'');
  if(e.key==='F1'){e.preventDefault();keys();return}
  if(e.key==='?'&&!ty&&!ctl&&!e.altKey){e.preventDefault();keys();return}
  if(ctl&&!e.altKey&&c==='Enter'){var r=$('run');if(r&&!r.disabled){e.preventDefault();r.click()}return}
  if(ctl&&!e.altKey&&c==='KeyS'){if(CURTAB==='ed'&&$('code')){e.preventDefault();saveCode()}return}
  if(ctl&&!e.altKey&&c==='KeyH'){var hb=$('hb');if(hb){e.preventDefault();hb.click()}return}
  if(ctl&&!e.altKey&&c==='KeyD'){e.preventDefault();toggleTheme();return}
  if(ctl&&!e.altKey&&c==='KeyM'){e.preventDefault();toggleMute();return}
  if((ctl||e.altKey)&&/^Digit[1-4]$/.test(c)&&NAV.classList.contains('on')){e.preventDefault();var b=NAV.querySelectorAll('button')[+c.slice(5)-1];if(b)b.click()}
});
seedLit();window.addEventListener('resize',function(){if(app.querySelector('.path'))links()});
applyTheme();
if(!S.nick)nick();else if(S.start<0)place();else greet();
</script>
